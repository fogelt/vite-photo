  <!--
    The loading curtain. Kept inline because the stylesheet below loads without
    blocking, so this must not depend on it: the page stays white from the first
    paint until the opening photos are ready, then a soft-edged wave slides away
    from the top-left corner. The same wave covers every route change. A spinner
    fades in only if the first load takes more than two seconds.
  -->
  <style>
    #site-curtain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      /* A white wash with a soft diagonal edge, sized three times the viewport
         and parked so that edge sits off-screen above the top-left corner. The
         reveal slides it down and across the page. */
      background-image: linear-gradient(
        155deg,
        transparent 0%,
        transparent 28%,
        #ffffff 34%,
        #ffffff 100%
      );
      background-repeat: no-repeat;
      background-size: 300% 300%;
      background-position: 55% 55%;
      transition: background-position 1300ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #site-curtain.is-revealing {
      background-position: -10% -10%;
      pointer-events: none;
    }

    #site-curtain .sc-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 88px;
      height: 88px;
      margin: -44px 0 0 -44px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 700ms ease;
    }

    /* The ring rotates on its own so the label inside stays still. */
    #site-curtain .sc-spinner::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(28, 25, 23, 0.08);
      border-top-color: #78716c;
      border-radius: 50%;
      animation: sc-spin 1.2s linear infinite;
    }

    #site-curtain.is-slow .sc-spinner {
      opacity: 1;
    }

    #site-curtain.is-revealing .sc-spinner {
      opacity: 0;
      transition-duration: 250ms;
    }

    #site-curtain .sc-label {
      padding-left: 0.28em;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #78716c;
      user-select: none;
    }

    #site-curtain .sc-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes sc-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #site-curtain {
        transition-duration: 1ms !important;
      }
    }
  </style>

<body>
  <!--
    Starts as a plain white screen. The app calls __revealSite once the opening
    photos have loaded, and __siteCurtainShow / __siteCurtainSettle on every
    route change; both end in the same soft diagonal wave. __siteMounted arms a
    last-resort reveal, so a photo that never finishes cannot trap an app that
    did render.
  -->
  <div id="site-curtain" role="status" aria-live="polite">
    <div class="sc-spinner" aria-hidden="true">
      <span class="sc-label">Laddar…</span>
    </div>
    <span class="sc-sr">Laddar…</span>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      var SPINNER_AFTER = 2000;
      var FIRST_GIVE_UP_AFTER = 12000;
      var ROUTE_GIVE_UP_AFTER = 6000;
      // The first sheet uses the CSS transition below; route sheets get a
      // quicker one inline.
      var FIRST_WAVE = 1300;
      var ROUTE_WAVE = 800;
      // A short beat of white so a fast `settle` still reads as a transition.
      var ROUTE_HOLD = 150;
      // Give the new route's photos a moment to arrive before the wave, but
      // never hold the page back for long.
      var ROUTE_PHOTO_WAIT = 500;

      var curtain = document.getElementById('site-curtain');
      if (!curtain) return;

      var reducedMotion = Boolean(
        window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches
      );

      // The page underneath is styled by the non-blocking stylesheet, so hold
      // the curtain until that is applied too; otherwise the wave would expose
      // an unstyled page.
      var stylesheet = document.getElementById('main-css');
      var stylesReady = !stylesheet || Boolean(stylesheet.sheet);
      var pending = false;
      var revealed = false;
      var waveDuration = FIRST_WAVE;
      var spinnerTimer = null;
      var giveUpTimer = null;
      var removeTimer = null;

      function clearTimers() {
        window.clearTimeout(spinnerTimer);
        window.clearTimeout(giveUpTimer);
        window.clearTimeout(removeTimer);
      }

      /** Plain white for the first couple of seconds: no spinner on a fast load. */
      function startSpinner() {
        spinnerTimer = window.setTimeout(function () {
          if (!revealed) curtain.classList.add('is-slow');
        }, SPINNER_AFTER);
      }

      function revealNow() {
        if (revealed) return;
        revealed = true;
        pending = false;

        window.clearTimeout(spinnerTimer);
        window.clearTimeout(giveUpTimer);

        var element = curtain;
        element.classList.add('is-revealing');

        window.clearTimeout(removeTimer);
        removeTimer = window.setTimeout(function () {
          if (element.parentNode) element.parentNode.removeChild(element);
        }, reducedMotion ? 150 : waveDuration + 250);
      }

      function reveal() {
        if (revealed) return;
        pending = true;
        if (stylesReady) revealNow();
      }

      /**
       * Only give up on a photo once the app has actually rendered. Arming this
       * earlier would remove the curtain on a very slow connection while the
       * bundle is still downloading, uncovering a blank page that looks broken;
       * an honest spinner is better than that.
       */
      function armFirstFailsafe() {
        if (revealed || giveUpTimer) return;
        giveUpTimer = window.setTimeout(reveal, FIRST_GIVE_UP_AFTER);
      }

      /** The photos near the top of the page, which the wave reveals first. */
      function firstVisibleImageSrcs() {
        var viewportHeight = window.innerHeight;
        var images = document.querySelectorAll('main img');
        var srcs = [];

        for (var i = 0; i < images.length && srcs.length < 4; i++) {
          var rect = images[i].getBoundingClientRect();
          if (rect.bottom > 0 && rect.top < viewportHeight) {
            var src = images[i].currentSrc || images[i].src;
            if (src) srcs.push(src);
          }
        }

        return srcs;
      }

      function waitForImage(src) {
        return new Promise(function (resolve) {
          var image = new Image();
          image.onload = resolve;
          image.onerror = resolve;
          image.src = src;
        });
      }

      /** Reveal once the new route's opening photos are in, or after a beat. */
      function revealWhenPhotosReady(element) {
        var done = false;

        var finish = function () {
          if (done) return;
          done = true;
          if (curtain === element) revealNow();
        };

        // Never hold the page back longer than this, photo or skeleton.
        window.setTimeout(finish, ROUTE_PHOTO_WAIT);

        var check = function () {
          if (done || curtain !== element) return;

          var srcs = firstVisibleImageSrcs();
          if (srcs.length > 0) {
            Promise.all(srcs.map(waitForImage)).then(finish);
            return;
          }

          window.setTimeout(check, 80);
        };

        check();
      }

      /**
       * Cover the page with a fresh sheet. Called when a navigation starts, so
       * the old page is hidden before the new route's chunk arrives — and again
       * when the route lands, in which case the sheet is already up.
       */
      function show() {
        if (
          curtain &&
          curtain.parentNode &&
          !curtain.classList.contains('is-revealing')
        ) {
          return;
        }

        clearTimers();

        if (curtain && curtain.parentNode) curtain.parentNode.removeChild(curtain);

        // Purely visual: the route underneath has already rendered, so there is
        // nothing loading to announce to a screen reader.
        var element = document.createElement('div');
        element.id = 'site-curtain';
        element.setAttribute('aria-hidden', 'true');
        // Sit under the sticky header (z-60) so the site's chrome stays put
        // while the page below it waves in.
        element.style.zIndex = '50';
        // Route waves are quicker than the first load's.
        element.style.transitionDuration = ROUTE_WAVE + 'ms';
        document.body.appendChild(element);

        curtain = element;
        waveDuration = ROUTE_WAVE;
        revealed = false;
        pending = false;

        // A stuck page must never be left behind a blank sheet.
        giveUpTimer = window.setTimeout(function () {
          if (curtain === element) revealNow();
        }, ROUTE_GIVE_UP_AFTER);
      }

      /**
       * The new route is committed: hold briefly, let its opening photos arrive
       * (a beat, not a wait for everything), then start the wave.
       */
      function settle() {
        var element = curtain;
        if (!element) return;

        window.setTimeout(function () {
          if (curtain !== element) return;
          revealWhenPhotosReady(element);
        }, ROUTE_HOLD);
      }

      if (stylesheet && !stylesReady) {
        var markStylesReady = function () {
          stylesReady = true;
          if (pending) revealNow();
        };
        stylesheet.addEventListener('load', markStylesReady);
        stylesheet.addEventListener('error', markStylesReady);
      }

      startSpinner();

      window.__revealSite = reveal;
      window.__siteMounted = armFirstFailsafe;
      window.__siteCurtainShow = show;
      window.__siteCurtainSettle = settle;
    })();
  </script>
